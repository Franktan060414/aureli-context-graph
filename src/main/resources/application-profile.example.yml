# Copy to application-dev.yml or application-prod.yml, then set local environment variables.
# The copied profile files stay on this machine and are not tracked by Git.
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/robot}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  sql:
    init:
      mode: always
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000
        table-name: t_vector_store

customer-service:
  md-storage-path: ${MARKDOWN_STORAGE_PATH:./Markdown}
