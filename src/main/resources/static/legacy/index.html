<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sequerenoS</title>
  <link rel="stylesheet" href="../app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">sequerenoS</p>
        <h1>AURELI Context Graph</h1>
      </div>
      <div class="top-actions">
        <label class="base-url">
          <span>接口地址</span>
          <input id="baseUrl" type="text" value="" placeholder="默认当前服务">
        </label>
        <button class="ghost" id="resetWorkspace" type="button">重置画布</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel side-panel">
        <div class="panel-head">
          <span class="section-mark"></span>
          <h2>接口控制台</h2>
        </div>

        <div class="tabs" role="tablist" aria-label="接口分类">
          <button class="tab active" data-tab="tile" type="button">Tile 客服</button>
          <button class="tab" data-tab="customer" type="button">知识库</button>
        </div>

        <section class="tab-page active" id="tab-tile">
          <form id="tileForm" class="form-stack">
            <label>
              <span>提问内容</span>
              <textarea id="tileMessage" rows="5" placeholder="例如：课程适合零基础学习吗？" required></textarea>
            </label>
            <label>
              <span>当前 Tile ID</span>
              <input id="tileId" type="text" required>
            </label>
            <div class="form-grid two">
              <label>
                <span>边方向</span>
                <select id="edgeDirection">
                  <option value="DIRECTED">单向</option>
                  <option value="UNDIRECTED">双向</option>
                </select>
              </label>
              <label>
                <span>关系类型</span>
                <input id="relationType" type="text" value="EXTENDS" placeholder="EXTENDS">
              </label>
            </div>
            <label>
              <span>备注</span>
              <input id="edgeDescription" type="text" placeholder="例如：从该 Tile 继续追问">
            </label>
            <div class="button-row">
              <button type="submit">发送并生成 Tile</button>
              <button class="secondary" id="blankTile" type="button">空白处提问</button>
            </div>
          </form>
        </section>

        <section class="tab-page" id="tab-customer">
          <form id="mdUploadForm" class="form-stack compact">
            <label>
              <span>上传 Markdown 问答文件</span>
              <input id="mdFile" type="file" accept=".md,.markdown">
            </label>
            <button type="submit">上传到知识库</button>
          </form>

          <form id="mdListForm" class="form-grid">
            <label>
              <span>页码</span>
              <input id="mdCurrent" type="number" min="1" value="1">
            </label>
            <label>
              <span>数量</span>
              <input id="mdSize" type="number" min="1" value="10">
            </label>
            <button type="submit">查询文件</button>
          </form>

          <form id="mdUpdateForm" class="form-stack compact">
            <label>
              <span>文件 ID</span>
              <input id="mdUpdateId" type="number" min="1">
            </label>
            <label>
              <span>备注</span>
              <input id="mdRemark" type="text" placeholder="新的备注">
            </label>
            <button type="submit">更新备注</button>
          </form>

          <form id="mdDeleteForm" class="form-stack compact">
            <label>
              <span>删除文件 ID</span>
              <input id="mdDeleteId" type="number" min="1">
            </label>
            <button class="danger" type="submit">删除文件</button>
          </form>
        </section>
      </aside>

      <section class="canvas-panel">
        <div class="canvas-toolbar">
          <div>
            <p class="eyebrow">Context Graph</p>
            <h2>Tile 画布</h2>
          </div>
          <div class="legend">
            <span><i class="dot rag"></i>共享 RAG</span>
            <span><i class="dot memory"></i>可选工作记忆</span>
          </div>
        </div>
        <div class="canvas" id="canvas" aria-label="Tile 画布"></div>
      </section>

      <aside class="panel detail-panel">
        <div class="panel-head">
          <span class="section-mark amber"></span>
          <h2>上下文与结果</h2>
        </div>
        <div class="selected-card" id="selectedTile">
          <p class="muted">选择一个 Tile 查看它的来源链和回答内容。</p>
        </div>
        <div class="response-box">
          <div class="response-head">
            <span>接口响应</span>
            <button class="tiny" id="clearOutput" type="button">清空</button>
          </div>
          <pre id="output"></pre>
        </div>
      </aside>
    </main>
  </div>

  <script src="../app.js"></script>
</body>
</html>
