server:
  port: 8080 # 项目启动端口

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  profiles:
    active: dev # 激活 dev 开发环境
  ai:
    openai:
      # 模型配置数据库读取失败时，使用局域网 Ollama 兜底。
      base-url: ${OLLAMA_BASE_URL:http://192.168.0.106:11434/v1}
      api-key: ${OLLAMA_API_KEY:ollama}
      embedding:
        base-url: ${OLLAMA_BASE_URL:http://192.168.0.106:11434/v1}
        api-key: ${OLLAMA_API_KEY:ollama}
        model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:4b}
        dimensions: 1536

customer-service:
  base-url: ${OLLAMA_BASE_URL:http://192.168.0.106:11434/v1}
  api-key: ${OLLAMA_API_KEY:ollama}
  model: ${OLLAMA_CHAT_MODEL:llama3:latest}
  temperature: 0.0

logging:
  config: classpath:log4j2.xml # 设置日志配置文件路径
